name: PhotoGalaxy
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  PhotoGalaxy:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    info:
      path: PhotoGalaxy/Info.plist
    sources:
      - path: PhotoGalaxy
        excludes:
          - "static/**"
          - "Info.plist"
      - path: PhotoGalaxy/static
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.photogalaxy
        INFOPLIST_FILE: PhotoGalaxy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: Photos.framework
